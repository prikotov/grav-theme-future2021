form:
  validation: loose
  fields:
  
    production-mode:
      type: toggle
      label: FUTURE.ADMIN.THEME.PRODUCTION_MODE
      help: FUTURE.ADMIN.THEME.PRODUCTION_MODE_HELP
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    
    sidebar:
      type: toggle
      label: FUTURE.ADMIN.THEME.SIDEBAR
      help: FUTURE.ADMIN.THEME.SIDEBAR_HELP
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    
    google_fonts_local:
      type: toggle
      label: FUTURE.ADMIN.THEME.GOOGLE_FONTS.LOCAL
      highlight: 0
      default: 0
      options:
          1: PLUGIN_ADMIN.ENABLED
          0: PLUGIN_ADMIN.DISABLED
      validate:
          type: bool

    social_preview_image_base_url:
      type: text
      label: Social preview image base URL
      help: Optional absolute base URL for OpenGraph/Twitter/JSON-LD page images. Leave empty to use the current site URL.
      placeholder: https://mirror4.prikotov.pro
      default: ''
      validate:
        type: url

    social_preview_image_query:
      type: text
      label: Social preview image query
      help: Optional query string appended to OpenGraph/Twitter/JSON-LD page images for cache busting, for example tg=2026061101.
      placeholder: tg=2026061101
      default: ''
